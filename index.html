<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom Allocation System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN for Data Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>Smart Classroom Allocation System</h1>
        <p>AI-Powered & Analytics Driven Facility Management</p>
    </header>

    <main>
        <section id="allocation-form">
            <h2>Allocate Classroom</h2>
            <form id="classForm">
                <label for="className">Class Name / Subject:</label>
                <input type="text" id="className" placeholder="e.g. CSE (Data Science)" required>

                <label for="students">Number of Students:</label>
                <input type="number" id="students" placeholder="e.g. 50" required>

                <label for="timeSlot">Time Slot:</label>
                <select id="timeSlot" required>
                    <option value="">Select Time Slot</option>
                    <option value="09:00 AM - 10:00 AM">09:00 AM - 10:00 AM</option>
                    <option value="10:00 AM - 11:00 AM">10:00 AM - 11:00 AM</option>
                    <option value="11:15 AM - 12:15 PM">11:15 AM - 12:15 PM</option>
                    <option value="01:15 PM - 02:15 PM">01:15 PM - 02:15 PM</option>
                </select>

                <div class="checkbox-group">
                    <label><input type="checkbox" id="reqProjector"> Requires Projector/Smart Board</label>
                    <label><input type="checkbox" id="reqLab"> Requires High-End Computers (Lab)</label>
                </div>

                <button type="submit">Allocate Room</button>
            </form>
        </section>

        <section id="result">
            <h2>Allocation Status</h2>
            <div id="output">No rooms allocated yet.</div>
        </section>

        <!-- Data Science Analytics Section -->
        <section id="analytics">
            <h2>Classroom Utilization Analytics</h2>
            <canvas id="usageChart"></canvas>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
